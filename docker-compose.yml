services:
  postgres:
    image: postgres:16-alpine
    container_name: it-company-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-itcompany}
      POSTGRES_USER: ${DB_USER:-itcompany}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-itcompany} -d ${DB_NAME:-itcompany}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    image: ${REGISTRY:-local}/it-company/backend:${VERSION:-1.0}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it-company-backend
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-itcompany}
      DB_USER: ${DB_USER:-itcompany}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      ADMIN_KEY: ${ADMIN_KEY:-change_this_admin_key}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ${REGISTRY:-local}/it-company/frontend:${VERSION:-1.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: it-company-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
